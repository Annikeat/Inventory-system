name: Build and Push Frontend & Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- FRONTEND ----------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set version tag
        id: version
        run: echo "TAG=v${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            aniketjok/inventory/frontend:${{ env.TAG }}
            aniketjok/inventory/frontend:latest

      # ---------------- BACKEND ----------------
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            aniketjok/inventory/backend:${{ env.TAG }}
            aniketjok/inventory/backend:latest

