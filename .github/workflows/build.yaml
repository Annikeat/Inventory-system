name: Build Frontend & Backend Images

on:
   workflow_dispatch:
   
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set version tag for auto-incrementing version
      - name: Set version tag
        run: echo "TAG=v${{ github.run_number }}" >> $GITHUB_ENV

      # Build & Push Frontend Image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: Inventory-system/frontend
          push: true
          tags: |
            aniketjok/inventory-frontend:latest
            aniketjok/inventory-frontend:${{ env.TAG }}

      # Build & Push Backend Image
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: Inventory-system/backend
          push: true
          tags: |
            aniketjok/inventory-backend:latest
            aniketjok/inventory-backend:${{ env.TAG }}
